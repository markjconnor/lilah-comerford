backend:
  name: github
  repo: markjconnor/lilah-comerford
  branch: main
  site_domain: lustrous-mousse-ae2cec.netlify.app

media_folder: "media"
public_folder: "media"

collections:
  - name: "pages"
    label: "Pages & Galleries"
    files:
      - label: "Homepage Slideshow"
        name: "homepage"
        file: "data/homepage.json"
        fields:
          - {
              label: "Images",
              name: "images",
              widget: "list",
              field: { label: "Image", name: "image", widget: "image" },
            }

      - label: "People Gallery"
        name: "people"
        file: "data/people.json"
        fields:
          - {
              label: "Images",
              name: "images",
              widget: "list",
              field: { label: "Image", name: "image", widget: "image" },
            }

      - label: "Kindred Language Gallery"
        name: "kindred"
        file: "data/kindred.json"
        fields:
          - {
              label: "Images",
              name: "images",
              widget: "list",
              field: { label: "Image", name: "image", widget: "image" },
            }

      - label: "Editorial and Commissions"
        name: "editorial"
        file: "data/editorial.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project Title", name: "title", widget: "string" }
              - {
                  label: "Images",
                  name: "images",
                  widget: "list",
                  field: { label: "Image", name: "image", widget: "image" },
                }
