<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilah Comerford</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand-link"><h1>Lilah Comerford</h1></a>
        <nav class="site-nav">
            <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
            <a href="lilah-people.html">People</a>
            <a href="lilah-kindred-language.html">Kindred Language</a>
            <a href="lilah-about.html">About</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <nav class="mobile-nav" id="mobileNav">
        <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
        <a href="lilah-people.html">People</a>
        <a href="lilah-kindred-language.html">Kindred Language</a>
        <a href="lilah-about.html">About</a>
    </nav>
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="container">
        <!-- Click the left half for the previous image, the right half for the next. Arrow keys work too. -->
        <div class="slideshow" id="slideshow">
            <img src="media/img20240419_15473705.jpg" alt="Homepage image 1" class="is-active">
            <img src="media/IMG_0285.jpg" alt="Homepage image 2">
            <img src="media/jude-and-theo--11.jpg" alt="Homepage image 3">
            <img src="media/upchuck-18.jpg" alt="Homepage image 4">
            <img src="media/img20250312_18515403.jpg" alt="Homepage image 5">
            <img src="media/img20241202_14043003-2.jpg" alt="Homepage image 6">
            <img src="media/Francesca-and-Josefina.jpg" alt="Homepage image 7">
            <img src="media/lilah-and-sofia.jpg" alt="Homepage image 8">
            <img src="media/79730003.jpeg" alt="Homepage image 9">
            <button class="zone zone-prev" aria-label="Previous image"></button>
            <button class="zone zone-next" aria-label="Next image"></button>
        </div>
    </div>

    <script>
        const INTERVAL = 3000;
        const slides = Array.from(document.querySelectorAll('#slideshow img'));
        let current = 0;
        let timer;

        function show(i) {
            slides[current].classList.remove('is-active');
            current = (i + slides.length) % slides.length;
            slides[current].classList.add('is-active');
        }
        // Restarts the 3-second countdown; called after every manual click.
        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => show(current + 1), INTERVAL);
        }
        function go(step) { show(current + step); startTimer(); }

        document.querySelector('.zone-next').addEventListener('click', () => go(1));
        document.querySelector('.zone-prev').addEventListener('click', () => go(-1));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') go(1);
            if (e.key === 'ArrowLeft') go(-1);
        });
        startTimer();
    </script>
    <script>
        // --- Mobile nav drawer ---
        const navToggle = document.getElementById('navToggle');
        const mobileNav = document.getElementById('mobileNav');
        const mobileNavOverlay = document.getElementById('mobileNavOverlay');

        function openNav() {
            document.body.classList.add('nav-open');
            mobileNav.classList.add('is-open');
            navToggle.setAttribute('aria-expanded', 'true');
        }
        function closeNav() {
            document.body.classList.remove('nav-open');
            mobileNav.classList.remove('is-open');
            navToggle.setAttribute('aria-expanded', 'false');
        }

        navToggle.addEventListener('click', () => {
            document.body.classList.contains('nav-open') ? closeNav() : openNav();
        });
        mobileNavOverlay.addEventListener('click', closeNav);
        mobileNav.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeNav));
    </script>
</body>
</html>
