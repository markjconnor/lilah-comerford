<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilah Culliford</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@300,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand-link"><h1>Lilah Culliford</h1></a>
        <nav class="site-nav">
            <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
            <a href="lilah-people.html">People</a>
            <a href="lilah-kindred-language.html">Kindred Language</a>
            <a href="lilah-about.html">About</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <nav class="mobile-nav" id="mobileNav">
        <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
        <a href="lilah-people.html">People</a>
        <a href="lilah-kindred-language.html">Kindred Language</a>
        <a href="lilah-about.html">About</a>
    </nav>
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="container">
        <!-- Images injected dynamically via CMS data -->
        <div class="slideshow" id="slideshow">
            <button class="zone zone-prev" aria-label="Previous image"></button>
            <button class="zone zone-next" aria-label="Next image"></button>
        </div>
    </div>

    <script>
        async function loadHomepage() {
            try {
                const res = await fetch('data/homepage.json');
                const data = await res.json();
                const slideshow = document.getElementById('slideshow');
                const prevBtn = slideshow.querySelector('.zone-prev');
                
                data.images.forEach((imgUrl, i) => {
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.alt = `Homepage image ${i + 1}`;
                    if (i === 0) img.classList.add('is-active');
                    slideshow.insertBefore(img, prevBtn);
                });

                // Initialize slider logic
                const INTERVAL = 2500;
                const slides = Array.from(document.querySelectorAll('#slideshow img'));
                let current = 0, timer;

                function show(i) {
                    if (slides.length === 0) return;
                    slides[current].classList.remove('is-active');
                    current = (i + slides.length) % slides.length;
                    slides[current].classList.add('is-active');
                }
                function startTimer() {
                    clearInterval(timer);
                    timer = setInterval(() => show(current + 1), INTERVAL);
                }
                function go(step) { show(current + step); startTimer(); }

                document.querySelector('.zone-next').addEventListener('click', () => go(1));
                document.querySelector('.zone-prev').addEventListener('click', () => go(-1));
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') go(1);
                    if (e.key === 'ArrowLeft') go(-1);
                });
                
                if (slides.length > 0) startTimer();
            } catch (e) { console.error("CMS data not found yet", e); }
        }
        loadHomepage();
    </script>
    <script src="nav.js"></script>
</body>
</html>
