<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial and Commissions | Lilah Culliford</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@300,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="editorial">
    <header class="site-header">
        <a href="index.html" class="brand-link"><h1>Lilah Culliford</h1></a>
        <nav class="site-nav">
            <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
            <a href="lilah-people.html">People</a>
            <a href="lilah-kindred-language.html">Kindred Language</a>
            <a href="lilah-about.html">About</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <nav class="mobile-nav" id="mobileNav">
        <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
        <a href="lilah-people.html">People</a>
        <a href="lilah-kindred-language.html">Kindred Language</a>
        <a href="lilah-about.html">About</a>
    </nav>
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="container">
        <!-- Content injected dynamically via CMS data -->
        <div class="projects-list"></div>
    </div>

    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js';

        async function loadEditorial() {
            try {
                const res = await fetch('data/editorial.json');
                const data = await res.json();
                const container = document.querySelector('.projects-list');

                data.projects.forEach(project => {
                    let slidesHtml = '';
                    project.images.forEach(imgUrl => {
                        slidesHtml += `
                            <div class="flick-slide" data-full="${imgUrl}">
                                <img src="${imgUrl}" alt="${project.title} image">
                            </div>`;
                    });

                    container.innerHTML += `
                        <div class="project">
                            <h2 class="project-title">${project.title}</h2>
                            <div class="flick-viewport">
                                <div class="flick-track">${slidesHtml}</div>
                            </div>
                        </div>`;
                });

                const lightbox = new PhotoSwipeLightbox({
                    pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js'),
                    bgOpacity: 1,
                });
                lightbox.init();

                document.querySelectorAll('.flick-viewport').forEach((viewport) => {
                    const track = viewport.querySelector('.flick-track');
                    const slides = Array.from(viewport.querySelectorAll('.flick-slide'));
                    let current = 0;

                    const buildItems = () => slides.map((slide) => {
                        const img = slide.querySelector('img');
                        return { src: slide.dataset.full, w: img.naturalWidth || 1500, h: img.naturalHeight || 1500 };
                    });

                    function goTo(index) {
                        current = index;
                        track.style.transform = `translateX(-${slides[index].offsetLeft}px)`;
                    }

                    slides.forEach((slide, i) => {
                        slide.addEventListener('click', () => {
                            if (i === current) {
                                lightbox.loadAndOpen(i, buildItems());
                            } else {
                                goTo(i);
                            }
                        });
                        slide.querySelector('img').addEventListener('load', () => goTo(current));
                    });
                    
                    if(slides.length > 0) goTo(0);
                    window.addEventListener('resize', () => goTo(current));
                });
            } catch (e) { console.error("CMS data not found yet", e); }
        }
        loadEditorial();
    </script>
    <script src="nav.js"></script>
</body>
</html>
