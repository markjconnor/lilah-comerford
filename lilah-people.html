<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People | Lilah Culliford</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@300,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery">
    <header class="site-header">
        <a href="index.html" class="brand-link"><h1>Lilah Culliford</h1></a>
        <nav class="site-nav">
            <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
            <a href="lilah-people.html">People</a>
            <a href="lilah-kindred-language.html">Kindred Language</a>
            <a href="lilah-about.html">About</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <nav class="mobile-nav" id="mobileNav">
        <a href="lilah-editorial-and-commissions.html">Editorial and Commissions</a>
        <a href="lilah-people.html">People</a>
        <a href="lilah-kindred-language.html">Kindred Language</a>
        <a href="lilah-about.html">About</a>
    </nav>
    <div class="mobile-nav-overlay" id="mobileNavOverlay"></div>

    <div class="container">
        <!-- Images injected dynamically via CMS data -->
        <div class="photo-grid"></div>
    </div>

    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js';

        async function loadGallery() {
            try {
                const res = await fetch('data/people.json');
                const data = await res.json();
                const grid = document.querySelector('.photo-grid');
                
                data.images.forEach(imgUrl => {
                    grid.innerHTML += `<a href="${imgUrl}"><img src="${imgUrl}" alt="People photo"></a>`;
                });

                const lightbox = new PhotoSwipeLightbox({
                    pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js'),
                    bgOpacity: 1,
                });
                lightbox.init();

                const links = Array.from(document.querySelectorAll('.photo-grid a'));
                links.forEach((link, i) => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const items = links.map((l) => {
                            const img = l.querySelector('img');
                            return { src: l.getAttribute('href'), w: img.naturalWidth || 1500, h: img.naturalHeight || 1500 };
                        });
                        lightbox.loadAndOpen(i, items);
                    });
                });
            } catch (e) { console.error("CMS data not found yet", e); }
        }
        loadGallery();
    </script>
    <script src="nav.js"></script>
</body>
</html>
